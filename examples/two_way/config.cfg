CONFIG DataCrcCheck yes
CONFIG AckSeqCheck no
CONFIG SkipLen yes
CONFIG AllocatorType buffer
CONFIG MaxPacketSize 128
CONFIG DataBufferSize 128
CONFIG StringBufferSize 0
CONFIG HeaderCrcAlgo CRC8_TECH3250
CONFIG DataCrcType CRC16_XMODEM

DEF TemperaturePacket Temperature INT16
DEF HumidityPacket Humidity INT16

DEF FanPacket SetRPM INT8
DEF HeaterPacket SetValue INT8
